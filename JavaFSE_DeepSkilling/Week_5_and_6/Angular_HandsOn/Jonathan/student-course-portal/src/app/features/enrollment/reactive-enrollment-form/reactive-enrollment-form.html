<div style="max-width: 500px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px;">
    <h2>Reactive Enrollment Form</h2>

    <form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">

        <div style="margin-bottom: 15px;">
            <label for="studentName">Student Name:</label><br>
            <input type="text" id="studentName" formControlName="studentName" style="width: 100%; padding: 8px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label for="studentEmail">Student Email:</label><br>
            <input type="email" id="studentEmail" formControlName="studentEmail" style="width: 100%; padding: 8px;">
            <!-- Async Validator Error Message -->
            <span *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']" style="color: red; font-size: 0.9em;">
                This email is already taken.
            </span>
            <!-- Optional: Show a message while the async validator is 'pending' -->
            <span *ngIf="enrollForm.get('studentEmail')?.status === 'PENDING'" style="color: blue; font-size: 0.9em;">
                Checking email availability...
            </span>
        </div>

        <div style="margin-bottom: 15px;">
            <label for="courseId">Course ID:</label><br>
            <!-- Changed type to text so we can test the 'XX' prefix -->
            <input type="text" id="courseId" formControlName="courseId" style="width: 100%; padding: 8px;">
            <!-- Step 54: Custom Sync Validator Error Message -->
            <span *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']" style="color: red; font-size: 0.9em;">
                Course code starting with XX is not allowed.
            </span>
        </div>

        <div style="margin-bottom: 15px;">
            <label for="preferredSemester">Preferred Semester:</label><br>
            <select id="preferredSemester" formControlName="preferredSemester" style="width: 100%; padding: 8px;">
                <option value="Odd">Odd</option>
                <option value="Even">Even</option>
            </select>
        </div>

        <!-- Step 56: FormArray Dynamic Controls -->
        <div style="margin-bottom: 15px; padding: 10px; border: 1px dashed #999;">
            <h4>Additional Courses</h4>
            <!-- Loop through the controls in the FormArray -->
            <div formArrayName="additionalCourses">
                <div *ngFor="let ctrl of additionalCourses.controls; let i=index"
                    style="margin-bottom: 10px; display: flex; gap: 10px;">
                    <input [formControlName]="i" placeholder="Enter course ID" style="flex: 1; padding: 8px;">
                    <button type="button" (click)="removeCourse(i)" style="padding: 8px; color: red;">Remove</button>
                </div>
            </div>
            <button type="button" (click)="addCourse()" style="padding: 8px; margin-top: 5px;">+ Add Another
                Course</button>
        </div>

        <div style="margin-bottom: 20px;">
            <label>
                <input type="checkbox" formControlName="agreeToTerms">
                I agree to the terms and conditions
            </label>
        </div>

        <button type="submit" [disabled]="enrollForm.invalid" style="padding: 10px 20px; cursor: pointer;">
            Submit Request
        </button>

    </form>
</div>
