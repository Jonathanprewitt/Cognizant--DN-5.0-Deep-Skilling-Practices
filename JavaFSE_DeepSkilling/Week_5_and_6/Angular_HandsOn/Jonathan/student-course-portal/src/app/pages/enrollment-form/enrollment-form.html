<div style="max-width: 500px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px;">
    <h2>Student Enrollment Request</h2>

    <!-- Success Message (Step 46) -->
    <div *ngIf="submitted"
        style="padding: 15px; background-color: #d4edda; color: #155724; border-radius: 5px; margin-bottom: 20px;">
        Enrollment request submitted successfully!
    </div>

    <!-- Hide the form once submitted, or you can leave it visible. We'll leave it visible but show the message above. -->
    <form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">

        <div style="margin-bottom: 15px;">
            <label for="studentName">Student Name:</label><br>
            <input type="text" id="studentName" name="studentName" [(ngModel)]="enrollmentData.studentName" required
                minlength="3" #nameCtrl="ngModel" style="width: 100%; padding: 8px;">
            <!-- Step 44: Conditional Error Messages -->
            <div *ngIf="nameCtrl.invalid && nameCtrl.touched" style="color: red; font-size: 0.9em; margin-top: 5px;">
                <span *ngIf="nameCtrl.errors?.['required']">Name is required.</span>
                <span *ngIf="nameCtrl.errors?.['minlength']">Name must be at least 3 characters.</span>
            </div>
        </div>

        <div style="margin-bottom: 15px;">
            <label for="studentEmail">Student Email:</label><br>
            <input type="email" id="studentEmail" name="studentEmail" [(ngModel)]="enrollmentData.studentEmail" required
                email #emailCtrl="ngModel" style="width: 100%; padding: 8px;">
            <div *ngIf="emailCtrl.invalid && emailCtrl.touched" style="color: red; font-size: 0.9em; margin-top: 5px;">
                <span *ngIf="emailCtrl.errors?.['required']">Email is required.</span>
                <span *ngIf="emailCtrl.errors?.['email']">Please enter a valid email address.</span>
            </div>
        </div>

        <div style="margin-bottom: 15px;">
            <label for="courseId">Course ID:</label><br>
            <input type="number" id="courseId" name="courseId" [(ngModel)]="enrollmentData.courseId" required
                #courseCtrl="ngModel" style="width: 100%; padding: 8px;">
            <div *ngIf="courseCtrl.invalid && courseCtrl.touched"
                style="color: red; font-size: 0.9em; margin-top: 5px;">
                <span *ngIf="courseCtrl.errors?.['required']">Course ID is required.</span>
            </div>
        </div>

        <div style="margin-bottom: 15px;">
            <label for="preferredSemester">Preferred Semester:</label><br>
            <select id="preferredSemester" name="preferredSemester" [(ngModel)]="enrollmentData.preferredSemester"
                required #semCtrl="ngModel" style="width: 100%; padding: 8px;">
                <option value="" disabled>Select a semester</option>
                <option value="Odd">Odd</option>
                <option value="Even">Even</option>
            </select>
            <div *ngIf="semCtrl.invalid && semCtrl.touched" style="color: red; font-size: 0.9em; margin-top: 5px;">
                <span *ngIf="semCtrl.errors?.['required']">Please select a semester.</span>
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <label>
                <input type="checkbox" name="agreeToTerms" [(ngModel)]="enrollmentData.agreeToTerms" required
                    #termsCtrl="ngModel">
                I agree to the terms and conditions
            </label>
            <div *ngIf="termsCtrl.invalid && termsCtrl.touched" style="color: red; font-size: 0.9em; margin-top: 5px;">
                <span *ngIf="termsCtrl.errors?.['required']">You must agree to the terms.</span>
            </div>
        </div>

        <div style="display: flex; gap: 10px;">
            <button type="submit" [disabled]="enrollForm.invalid" style="padding: 10px 20px; cursor: pointer;">
                Submit Request
            </button>

            <!-- Step 47: Reset Button -->
            <!-- type="button" prevents it from accidentally submitting the form -->
            <button type="button" (click)="enrollForm.resetForm(); submitted = false"
                style="padding: 10px 20px; cursor: pointer; background-color: #f4f4f4; border: 1px solid #ccc;">
                Reset
            </button>
        </div>

    </form>
</div>
