<div class="course-list-container">
    <h3>Available Courses</h3>

    <!-- Hands-On 3: Show this ONLY when isLoading is true -->
    <div *ngIf="isLoading$ | async">
        <p>Loading courses...</p>
    </div>

    <!-- Hands-On 3 & 6: Show the grid when isLoading is false -->
    <div *ngIf="!(isLoading$ | async)" class="courses-grid">
        <app-course-card *ngFor="let course of courses$ | async; trackBy: trackByCourseId" [course]="course"
            (click)="goToCourseDetails(course.id)" style="cursor: pointer;">
        </app-course-card>
    </div>
</div>
